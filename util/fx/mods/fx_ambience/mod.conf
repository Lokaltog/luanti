name = fx_ambience
title = fx ambience
description = Ambient particles for the fx fork: drips, bubbles and breath fog; with fx_ambience_legacy_particles also fireflies, motes, embers, falling leaves and Nether air (the fx client's GPU particles draw those). Game agnostic (uses node groups). Respects the fx_particles setting.
