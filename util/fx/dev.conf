# Client config for working on the fx renderer: `fx-run` starts with this.
# Copy lines into your own luanti.conf to keep them.
video_driver = opengl3
enable_post_processing = true
enable_bloom = true
enable_auto_exposure = true
enable_dynamic_shadows = true
enable_volumetric_lighting = true
smooth_lighting = true
viewing_range = 240
fps_max = 144

fx_enable = true
fx_shader_hot_reload = true
