# fx: situational targets shared by every mood (a mood's own targets for
# the same situation and key win). Situations come from the camera (night,
# cave, underwater) and from the fx_hints server mod (rain, snow, storm,
# nether, end, portal, biome.<name>); "heat" is the Nether near lava.
# Weights blend in over ~1.5 s; later sections win where they overlap.

# rain and storms: softer distance, muted colour
rain.fx_fog_blur = 1.2
rain.fx_grade_saturation = 0.88
snow.fx_fog_blur = 1.0
snow.fx_grade_warmth = -0.2
storm.fx_fog_blur = 2.0
storm.fx_grade_saturation = 0.72
storm.fx_grade_contrast = 1.08
storm.fx_vignette = 0.25

# the Nether: gloomy and blurred away from lava ...
nether.fx_fog_blur = 1.8
nether.fx_grade_warmth = 0.3
nether.fx_vignette = 0.3
nether.fx_heat_haze = 0.8
# ... per biome ...
biome.CrimsonForest.fx_grade_warmth = 0.5
biome.CrimsonForest.fx_grade_saturation = 1.1
biome.WarpedForest.fx_grade_warmth = -0.25
biome.SoulsandValley.fx_grade_warmth = -0.4
biome.SoulsandValley.fx_grade_saturation = 0.7
biome.SoulsandValley.fx_fog_blur = 2.2
biome.BasaltDelta.fx_grade_saturation = 0.65
biome.BasaltDelta.fx_fog_blur = 2.4
biome.BasaltDelta.fx_grade_warmth = -0.1
# ... and hot near lava
heat.fx_grade_warmth = 0.6
heat.fx_heat_haze = 1.8
heat.fx_bloom_intensity = 0.5
heat.fx_fog_blur = 1.0
heat.fx_vignette = 0.2

# the End: cold, still
end.fx_grade_warmth = -0.2
end.fx_vignette = 0.25
end.fx_fog_blur = 0.8

# height fog: valleys fill with mist at dawn and in rain; none in the
# Nether and the End (no ground level there)
dawn.fx_height_fog = 2.0
rain.fx_height_fog = 1.2
storm.fx_height_fog = 1.8
nether.fx_height_fog = 0.0
end.fx_height_fog = 0.0
# the Nether's air glows more around lava and fire
nether.fx_volumetric = 1.6
