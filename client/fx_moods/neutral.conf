# fx mood: neutral, the defaults. A mood is an overlay: every tunable it
# does not name is reset to its default when the mood is applied.
#
# Plain lines set fx_* tunables. cave.* / night.* / underwater.* are targets
# the renderer blends towards while you are in a cave, at night or under
# water (smoothed over ~1.5 s). Unknown keys are reported in the log.

cave.fx_exposure = 2.0
