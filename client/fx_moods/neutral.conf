# fx mood: neutral. Close to the defaults; the base other moods start from.
# Plain lines set fx_* settings when the mood is selected.
# cave.* / night.* / underwater.* are targets the renderer blends towards
# while you are in a cave, at night or under water (smoothed over ~1.5 s).
fx_exposure = 1.5
fx_grade_saturation = 1.3
fx_grade_contrast = 1.2
fx_bloom_intensity = 0.6
fx_light_saturation = 0.85
fx_sky_tint = 0.8
fx_ambient_floor = 0.03
fx_ao_strength = 1.0

cave.fx_exposure = 1.9
night.fx_light_saturation = 1.0
